[build]
  publish = "."
  functions = "netlify/functions"

# ============================================================
# URL NORMALIZATION — Enforce single canonical URL format:
#   https://truecarebeautyai.com/path (no trailing slash, no .html)
# ============================================================
# NOTE: The previous `/*/ → /:splat` rule was removed because
# Netlify's redirect engine matched it against every path
# (including /), producing a site-wide self-redirect loop
# (ERR_TOO_MANY_REDIRECTS). Trailing-slash normalization is
# handled by Netlify's default asset pretty_urls behavior and
# by the specific 200 rewrites below.

# Redirect /index.html → / directly (must precede /*.html to avoid a 2-hop chain)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Strip .html extensions → 301 to clean URL
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# Redirect /index to root
[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true

# ============================================================
# CLEAN URL REWRITES — Serve .html files at clean paths (200)
# ============================================================

# Main pages
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true

